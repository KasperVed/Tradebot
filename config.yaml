# FOMO bot config - sat op til en lille konto (ca. 2 SOL / 1000 kr).
# Secrets go in .env, never here. execution.mode: paper (simulated) or live (real funds, also needs --live).
# Small account: max 0.1 SOL per trade, max 3 positions, max 25% of the account in play,
# 0.1 SOL kept for fees, entries stop after a 10% losing day or 3 losses in a row (2h pause).
# Strategy defaults are backed by research/ (31k real memecoins); see README.
tick_seconds: 30.0
db_path: fomobot.db
discovery:
  use_latest_profiles: true
  use_boosted: true
  use_top_boosts: true
  use_pumpportal: true
  use_geckoterminal: true
  geckoterminal_every_ticks: 2
  search_queries:
  - pumpswap
  - raydium
  max_candidates: 80
safety:
  min_liquidity_usd: 10000.0
  max_liquidity_usd: 5000000.0
  min_market_cap_usd: 15000.0
  max_market_cap_usd: 20000000.0
  min_age_minutes: 2.0
  max_age_hours: 72.0
  min_txns_h1: 50
  max_top_holder_pct: 20.0
  max_top10_pct: 30.0
  max_creator_pct: 5.0
  max_insider_pct: 15.0
  max_transfer_fee_pct: 0.0
  min_holders: 50
  min_lp_locked_pct: 80.0
  require_lp_locked: false
  unlocked_lp_size_factor: 0.5
  reject_mint_authority: true
  reject_freeze_authority: true
  use_rugcheck: true
  max_rugcheck_danger_risks: 0
strategy:
  rule_buy_threshold: 70.0
  llm_min_score: 60.0
  llm_min_conviction: 65.0
  default_take_profit_pct: 100.0
  default_stop_loss_pct: 25.0
  tp_sell_fraction: 0.5
  take_profit_ladder:
  - - 50.0
    - 0.25
  - - 100.0
    - 0.25
  - - 200.0
    - 0.25
  trailing_stop_pct: 35.0
  max_hold_minutes: 240.0
  exit_on_liquidity_drop_pct: 50.0
  reentry_cooldown_minutes: 120.0
  breakeven_after_tp: true
  fast_exit_seconds: 2.0
  entry_gate:
    enabled: false
    min_ret5: -0.05
    max_ret5: 0.3
    min_ret60: -0.25
    max_ret60: 3.0
    min_vol_accel: 0.5
    min_green: 0.45
    min_age_min: 2.0
    max_dd60: 0.4
risk:
  base_position_pct: 5.0
  max_position_sol: 0.1
  min_position_sol: 0.05
  max_open_positions: 3
  max_exposure_pct: 25.0
  daily_loss_limit_pct: 10.0
  consecutive_loss_pause: 3
  pause_minutes: 120.0
  sol_reserve: 0.1
ml:
  enabled: true
  min_percentile: 0.9
  max_age_minutes: 30.0
  top_tier_percentile: 0.95
  top_tier_size: 1.25
  lower_tier_size: 0.75
  reject_out_of_domain: true
  require_pumpfun: true
  model_path: null
llm:
  enabled: true
  model: claude-opus-5-5
  effort: high
  decision_cache_minutes: 20.0
  max_calls_per_hour: 20
  reflect_on_closed_trades: true
  lessons_in_prompt: 12
  backtest_result_path: null
execution:
  mode: paper
  paper_starting_sol: 2.0
  paper_fee_pct: 1.0
  paper_slippage_pct: 1.5
  paper_fixed_cost_sol: 0.003
  slippage_bps: 300
  roundtrip_check: true
  max_roundtrip_loss_pct: 10.0
  jupiter_base_url: https://lite-api.jup.ag/swap/v1
  priority_fee_lamports: auto
  confirm_timeout_s: 60.0
